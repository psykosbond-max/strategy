    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;

      height: 100%;
      overflow: auto;
    }
    body {

      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;

    /* Landscape orientation lock overlay */
    .rotate-device-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    
    .rotate-icon {
      width: 80px;
      height: 80px;
      border: 4px solid #8b5cf6;
      border-radius: 12px;
      position: relative;
      animation: rotateHint 2s ease-in-out infinite;
    }
    
    .rotate-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      border: 3px solid #8b5cf6;
      border-radius: 4px;
    }
    
    .rotate-icon::after {
      content: '↻';
      position: absolute;
      top: -30px;
      right: -30px;
      font-size: 32px;
      color: #10b981;
      animation: spin 2s ease-in-out infinite;
    }
    
    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    
    @keyframes spin {
      0%, 100% { transform: rotate(0deg); opacity: 1; }
      50% { transform: rotate(180deg); opacity: 0.5; }
    }
    
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -150%) scale(1); }
      50% { transform: translate(-50%, -150%) scale(1.1); }
    }
    
    @keyframes pulse-desktop {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }

    const { useState, useEffect, useRef } = React;

// Mini-Game Component
const MiniGameComponent = ({ miniGame, onComplete, onCancel }) => {
  const [gameState, setGameState] = useState({
    input: '',
    score: 0,
    round: 1,
    timeLeft: 60,
    feedback: '',
    choices: []
  });

  // Generate choices based on game type
  useEffect(() => {
    if (miniGame.type === 'tagline') {
      generateTaglineChoices();
    } else if (miniGame.type === 'social') {
      generateSocialChoices();
    } else if (miniGame.type === 'pitch') {
      generatePitchChoices();
    }
  }, [miniGame.type]);

  // Timer
  useEffect(() => {
    const timer = setInterval(() => {
      setGameState(prev => {
        if (prev.timeLeft <= 0) {
          clearInterval(timer);
          onComplete(prev.score);
          return prev;
        }
        return { ...prev, timeLeft: prev.timeLeft - 1 };
      });
    }, 1000);
    return () => clearInterval(timer);
  }, []);

  const generateTaglineChoices = () => {
    const taglineOptions = [
      { text: 'Fresh beans, bold flavor', score: 85 },
      { text: 'Coffee that cares', score: 92 },
      { text: 'Brew good. Feel better.', score: 95 },
      { text: 'Just another coffee', score: 40 },
      { text: 'Sustainable sips for a better tomorrow', score: 88 }
    ];
    setGameState(prev => ({ ...prev, choices: taglineOptions }));
  };

  const generateSocialChoices = () => {
    const socialOptions = [
      { text: '✨ Innovation starts here #TechStart', score: 80 },
      { text: '🚀 Building the future, one line of code at a time', score: 92 },
      { text: '💡 Where great ideas become reality', score: 85 },
      { text: 'Check out our stuff', score: 30 },
      { text: '🔥 Disrupting industries. Creating possibilities. #StartupLife', score: 90 }
    ];
    setGameState(prev => ({ ...prev, choices: socialOptions }));
  };

  const generatePitchChoices = () => {
    const pitchOptions = [
      { text: 'Focus on sustainability and style', score: 88 },
      { text: 'Emphasize exclusivity and luxury craftsmanship', score: 95 },
      { text: 'Highlight affordability', score: 60 },
      { text: 'Appeal to eco-conscious millennials with bold designs', score: 92 },
      { text: 'Just talk about fashion', score: 35 }
    ];
    setGameState(prev => ({ ...prev, choices: pitchOptions }));
  };

  const handleChoice = (choice) => {
    const newScore = Math.min(100, gameState.score + choice.score);
    setGameState(prev => ({
      ...prev,
      score: newScore,
      feedback: choice.score >= 80 ? '✅ Excellent!' : choice.score >= 60 ? '👍 Good' : '❌ Could be better',
      choices: []
    }));

    setTimeout(() => {
      if (newScore >= 80) {
        onComplete(newScore);
      } else if (gameState.round < 2) {
        setGameState(prev => ({
          ...prev,
          round: prev.round + 1,
          feedback: ''
        }));
        if (miniGame.type === 'tagline') generateTaglineChoices();
        else if (miniGame.type === 'social') generateSocialChoices();
        else if (miniGame.type === 'pitch') generatePitchChoices();
      } else {
        onComplete(newScore);
      }
    }, 1500);
  };

  const getGameTitle = () => {
    if (miniGame.type === 'tagline') return '✍️ Tagline Challenge';
    if (miniGame.type === 'social') return '📱 Social Media Copy';
    if (miniGame.type === 'pitch') return '🎤 Client Pitch';
    if (miniGame.type === 'longform') return '📝 Brand Voice Guide';
    if (miniGame.type === 'speed') return '⚡ Speed Writing';
    return '🎮 Challenge';
  };

  const getGameInstructions = () => {
    if (miniGame.type === 'tagline') return 'Choose the best tagline for FreshBrew Coffee:';
    if (miniGame.type === 'social') return 'Pick the best Instagram caption for TechStart:';
    if (miniGame.type === 'pitch') return 'What angle should we pitch for this fashion brand?';
    return 'Complete the challenge:';
  };

  return (
    <div className="fixed inset-0 flex items-center justify-center p-4 z-50" style={{
      background: 'rgba(0, 0, 0, 0.9)',
      backdropFilter: 'blur(12px)'
    }}>
      <div className="rounded-xl p-8 max-w-2xl w-full" style={{
        background: '#ffffff',
        border: '4px solid #8b5cf6',
        boxShadow: '0 0 60px rgba(139, 92, 246, 0.5)'
      }}>
        {/* Header */}
        <div className="flex justify-between items-center mb-6">
          <h2 className="pixel-font text-lg" style={{ color: '#8b5cf6' }}>
            {getGameTitle()}
          </h2>
          <div className="pixel-font text-sm" style={{ color: '#6b7280' }}>
            ⏱️ {gameState.timeLeft}s
          </div>
        </div>

        {/* Score Bar */}
        <div className="mb-6">
          <div className="flex justify-between text-xs mb-2 pixel-font" style={{ color: '#1f2937' }}>
            <span>Score</span>
            <span>{gameState.score}/100</span>
          </div>
          <div style={{
            width: '100%',
            height: '12px',
            background: '#e5e7eb',
            borderRadius: '6px',
            overflow: 'hidden'
          }}>
            <div style={{
              width: `${gameState.score}%`,
              height: '100%',
              background: gameState.score >= 80 ? '#10b981' : gameState.score >= 60 ? '#f59e0b' : '#8b5cf6',
              transition: 'width 0.5s'
            }} />
          </div>
        </div>

        {/* Instructions */}
        <p className="pixel-font text-xs mb-6" style={{
          color: '#1f2937',
          lineHeight: '2'
        }}>
          {getGameInstructions()}
        </p>

        {/* Feedback */}
        {gameState.feedback && (
          <div className="mb-4 p-4 rounded-lg pixel-font text-xs text-center" style={{
            background: gameState.feedback.includes('✅') ? '#d1fae5' : gameState.feedback.includes('❌') ? '#fee2e2' : '#fef3c7',
            color: '#1f2937'
          }}>
            {gameState.feedback}
          </div>
        )}

        {/* Choices */}
        {gameState.choices.length > 0 && (
          <div className="flex flex-col gap-3 mb-6">
            {gameState.choices.map((choice, i) => (
              <button
                key={i}
                onClick={() => handleChoice(choice)}
                className="pixel-font text-xs px-6 py-4 rounded-lg text-left transition-all"
                style={{
                  background: '#f9fafb',
                  border: '3px solid #e5e7eb',
                  color: '#1f2937',
                  cursor: 'pointer'
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.background = '#8b5cf6';
                  e.currentTarget.style.color = '#ffffff';
                  e.currentTarget.style.borderColor = '#7c3aed';
                  e.currentTarget.style.transform = 'translateX(8px)';
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.background = '#f9fafb';
                  e.currentTarget.style.color = '#1f2937';
                  e.currentTarget.style.borderColor = '#e5e7eb';
                  e.currentTarget.style.transform = 'translateX(0)';
                }}
              >
                {choice.text}
              </button>
            ))}
          </div>
        )}

        {/* Cancel Button */}
        <button
          onClick={onCancel}
          className="pixel-font text-xs px-6 py-3 rounded"
          style={{
            background: '#6b7280',
            color: '#ffffff',
            border: '3px solid #4b5563',
            cursor: 'pointer'
          }}
        >
          ← Cancel
        </button>
      </div>
    </div>
  );
};

  useEffect(() => {

    const moveInterval = setInterval(() => {
      setNpcPositions(prev => {
        const newPositions = { ...prev };
        const currentRoom = rooms[gameState.currentRoom];
        
        currentRoom.npcs.forEach(npc => {
          // Skip Sarah (receptionist) - she stays at desk
          if (npc.name === 'Sarah') return;
          
          const key = `${gameState.currentRoom}-${npc.name}`;
          const currentPos = newPositions[key] || { x: npc.x, y: npc.y };
          
          // 40% chance to move each tick
          if (Math.random() < 0.4) {
            // Random direction: up, down, left, right
            const directions = [
              { dx: 0, dy: -0.3 },  // up
              { dx: 0, dy: 0.3 },   // down
              { dx: -0.3, dy: 0 },  // left
              { dx: 0.3, dy: 0 }    // right
            ];
            
            // Pick random number of steps (2-3)
            const steps = Math.random() < 0.5 ? 2 : 3;
            const direction = directions[Math.floor(Math.random() * directions.length)];
            
            let newX = currentPos.x + (direction.dx * steps);
            let newY = currentPos.y + (direction.dy * steps);
            
            // Keep within wander bounds if defined
            if (npc.wanderArea) {
              newX = Math.max(npc.wanderArea.minX, Math.min(npc.wanderArea.maxX, newX));
              newY = Math.max(npc.wanderArea.minY, Math.min(npc.wanderArea.maxY, newY));
            } else {
              // Default bounds - stay within room
              newX = Math.max(1, Math.min(ROOM_WIDTH - 1, newX));
              newY = Math.max(2, Math.min(ROOM_HEIGHT - 1, newY));
            }
            
            // Special collision avoidance for Pete in break room (avoid table)
            if (npc.name === 'Pete' && newX > 7 && newX < 11 && newY > 5 && newY < 9) {
              return; // Don't update position if trying to walk through table
            }
            
            newPositions[key] = { x: newX, y: newY };
          }
        });
        
        return newPositions;
      });
    }, 2000); // Move every 2 seconds

    return () => clearInterval(moveInterval);

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const currentRoom = rooms[gameState.currentRoom];

    // Draw floor
    ctx.fillStyle = currentRoom.floor;
    ctx.fillRect(0, 0, ROOM_WIDTH * TILE_SIZE, ROOM_HEIGHT * TILE_SIZE);

    // Draw wooden floor pattern for lobby
    if (gameState.currentRoom === 'lobby') {
      ctx.strokeStyle = 'rgba(139, 92, 112, 0.15)';
      ctx.lineWidth = 2;
      
      // Horizontal wood planks
      for (let i = 0; i < ROOM_HEIGHT * TILE_SIZE; i += 40) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(ROOM_WIDTH * TILE_SIZE, i);
        ctx.stroke();
        
        // Vertical seams at random intervals
        const seams = [100, 280, 420, 580, 720];
        seams.forEach(x => {
          ctx.beginPath();
          ctx.moveTo(x, i);
          ctx.lineTo(x, i + 40);
          ctx.stroke();
        });
      }
      
      // Wood grain effect
      ctx.strokeStyle = 'rgba(139, 92, 112, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < ROOM_HEIGHT * TILE_SIZE; i += 40) {
        for (let j = 0; j < 3; j++) {
          ctx.beginPath();
          ctx.moveTo(0, i + 10 + j * 10);
          ctx.lineTo(ROOM_WIDTH * TILE_SIZE, i + 10 + j * 10);
          ctx.stroke();
        }
      }
    }

    // Creative Department - Checkered wooden floor
    if (gameState.currentRoom === 'creative') {
      const squareSize = 50;
      
      // Draw checkered pattern
      for (let x = 0; x < ROOM_WIDTH; x++) {
        for (let y = 0; y < ROOM_HEIGHT; y++) {
          const squareX = x * squareSize;
          const squareY = y * squareSize;
          
          // Alternate light and dark wood squares
          if ((x + y) % 2 === 0) {
            // Light wood square
            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
            ctx.fillRect(squareX, squareY, squareSize, squareSize);
          } else {
            // Dark wood square
            ctx.fillStyle = 'rgba(180, 83, 9, 0.2)';
            ctx.fillRect(squareX, squareY, squareSize, squareSize);
          }
        }
      }
      
      // Wood grain lines on each square
      ctx.strokeStyle = 'rgba(120, 53, 15, 0.15)';
      ctx.lineWidth = 1;
      
      for (let x = 0; x < ROOM_WIDTH; x++) {
        for (let y = 0; y < ROOM_HEIGHT; y++) {
          const squareX = x * squareSize;
          const squareY = y * squareSize;
          
          // Horizontal wood grain
          for (let i = 0; i < 5; i++) {
            const offset = (i * 10) + 5;
            ctx.beginPath();
            ctx.moveTo(squareX, squareY + offset);
            ctx.lineTo(squareX + squareSize, squareY + offset);
            ctx.stroke();
          }
        }
      }
      
      // Square borders for definition
      ctx.strokeStyle = 'rgba(120, 53, 15, 0.25)';
      ctx.lineWidth = 2;
      
      for (let i = 0; i <= ROOM_WIDTH * squareSize; i += squareSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, ROOM_HEIGHT * squareSize);
        ctx.stroke();
      }
      for (let i = 0; i <= ROOM_HEIGHT * squareSize; i += squareSize) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(ROOM_WIDTH * squareSize, i);
        ctx.stroke();
      }
      
      // Add subtle wood knots randomly
      ctx.fillStyle = 'rgba(120, 53, 15, 0.2)';
      const knots = [
        { x: 125, y: 175 }, { x: 325, y: 275 }, { x: 575, y: 125 },
        { x: 225, y: 425 }, { x: 475, y: 325 }, { x: 675, y: 475 },
        { x: 75, y: 525 }, { x: 525, y: 75 }, { x: 375, y: 575 }
      ];
      
      knots.forEach(knot => {
        ctx.beginPath();
        ctx.arc(knot.x, knot.y, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // Knot rings
        ctx.strokeStyle = 'rgba(120, 53, 15, 0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(knot.x, knot.y, 6, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    // Servicing - Professional carpet texture
    if (gameState.currentRoom === 'servicing') {
      // Carpet fiber texture
      ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
      for (let y = 0; y < ROOM_HEIGHT * TILE_SIZE; y += 4) {
        for (let x = 0; x < ROOM_WIDTH * TILE_SIZE; x += 8) {
          const offset = (y / 4) % 2 === 0 ? 0 : 4;
          ctx.fillRect(x + offset, y, 6, 2);
        }
      }
      
      // Subtle carpet pattern - diamond shapes
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
      ctx.lineWidth = 1;
      const diamondSize = 60;
      for (let y = 0; y < ROOM_HEIGHT * TILE_SIZE; y += diamondSize) {
        for (let x = 0; x < ROOM_WIDTH * TILE_SIZE; x += diamondSize) {
          ctx.beginPath();
          ctx.moveTo(x + diamondSize / 2, y);
          ctx.lineTo(x + diamondSize, y + diamondSize / 2);
          ctx.lineTo(x + diamondSize / 2, y + diamondSize);
          ctx.lineTo(x, y + diamondSize / 2);
          ctx.closePath();
          ctx.stroke();
        }
      }
    }

    // Production Studio - Industrial concrete texture
    if (gameState.currentRoom === 'studio') {
      // Concrete texture - subtle irregular marks
      ctx.fillStyle = 'rgba(99, 102, 241, 0.06)';
      for (let i = 0; i < 150; i++) {
        const rx = Math.random() * ROOM_WIDTH * TILE_SIZE;
        const ry = Math.random() * ROOM_HEIGHT * TILE_SIZE;
        const w = Math.random() * 20 + 10;
        const h = Math.random() * 3 + 1;
        ctx.fillRect(rx, ry, w, h);
      }
      
      // Concrete expansion joints
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.12)';
      ctx.lineWidth = 3;
      
      // Large square sections
      const sectionSize = 150;
      for (let i = 0; i <= ROOM_WIDTH * TILE_SIZE; i += sectionSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, ROOM_HEIGHT * TILE_SIZE);
        ctx.stroke();
      }
      for (let i = 0; i <= ROOM_HEIGHT * TILE_SIZE; i += sectionSize) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(ROOM_WIDTH * TILE_SIZE, i);
        ctx.stroke();
      }
      
      // Concrete speckles
      ctx.fillStyle = 'rgba(99, 102, 241, 0.1)';
      for (let i = 0; i < 100; i++) {
        const rx = Math.random() * ROOM_WIDTH * TILE_SIZE;
        const ry = Math.random() * ROOM_HEIGHT * TILE_SIZE;
        const size = Math.random() * 2 + 1;
        ctx.fillRect(rx, ry, size, size);
      }
    }

    // Textured tile floor for break room
    if (gameState.currentRoom === 'breakroom') {
      const tileSize = 50;
      
      // Tile grid lines
      ctx.strokeStyle = 'rgba(219, 39, 119, 0.15)';
      ctx.lineWidth = 2;
      
      // Vertical lines
      for (let i = 0; i <= ROOM_WIDTH * TILE_SIZE; i += tileSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, ROOM_HEIGHT * TILE_SIZE);
        ctx.stroke();
      }
      
      // Horizontal lines
      for (let i = 0; i <= ROOM_HEIGHT * TILE_SIZE; i += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(ROOM_WIDTH * TILE_SIZE, i);
        ctx.stroke();
      }
      
      // Add subtle diagonal texture in each tile
      ctx.strokeStyle = 'rgba(219, 39, 119, 0.08)';
      ctx.lineWidth = 1;
      
      for (let x = 0; x < ROOM_WIDTH; x++) {
        for (let y = 0; y < ROOM_HEIGHT; y++) {
          const tileX = x * tileSize;
          const tileY = y * tileSize;
          
          // Diagonal lines for texture
          ctx.beginPath();
          ctx.moveTo(tileX, tileY);
          ctx.lineTo(tileX + tileSize, tileY + tileSize);
          ctx.stroke();
          
          // Alternate diagonal pattern (checkerboard effect)
          if ((x + y) % 2 === 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillRect(tileX, tileY, tileSize, tileSize);
          }
        }
      }
      
      // Add subtle speckles for ceramic tile effect
      ctx.fillStyle = 'rgba(219, 39, 119, 0.12)';
      for (let i = 0; i < 80; i++) {
        const rx = Math.random() * ROOM_WIDTH * TILE_SIZE;
        const ry = Math.random() * ROOM_HEIGHT * TILE_SIZE;
        const size = Math.random() * 2 + 1;
        ctx.fillRect(rx, ry, size, size);
      }
    }

    // Draw room border
    ctx.strokeStyle = currentRoom.accentColor;
    ctx.lineWidth = 6;
    ctx.strokeRect(0, 0, ROOM_WIDTH * TILE_SIZE, ROOM_HEIGHT * TILE_SIZE);

    // Draw room name - BIGGER AND CLEARER
    // Position banner lower in studio room to avoid door overlap
    const bannerY = gameState.currentRoom === 'studio' ? 80 : 0;
    const bannerHeight = 80;
    const bannerWidth = ROOM_WIDTH * TILE_SIZE;
    
    ctx.fillStyle = currentRoom.accentColor;
    ctx.fillRect(0, bannerY, bannerWidth, bannerHeight);
    
    // Inner glow
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(0, bannerY, bannerWidth, bannerHeight);
    
    // Border lines
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, bannerY, bannerWidth, bannerHeight);
    
    // Room name text - EXTRA LARGE
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 32px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Text with outline for maximum visibility
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 6;
    ctx.strokeText(currentRoom.name, (ROOM_WIDTH * TILE_SIZE) / 2, bannerY + bannerHeight / 2);
    ctx.fillText(currentRoom.name, (ROOM_WIDTH * TILE_SIZE) / 2, bannerY + bannerHeight / 2);

    // Draw furniture
    currentRoom.furniture.forEach(item => {
      drawFurniture(ctx, item);
    });

    // Draw exits/doors
    currentRoom.exits.forEach(exit => {
      drawExit(ctx, exit);
    });

    // Draw NPCs
    currentRoom.npcs.forEach(npc => {
      const key = `${gameState.currentRoom}-${npc.name}`;
      const dynamicPos = npcPositions[key];
      
      // Use dynamic position if available, otherwise use default
      if (dynamicPos && npc.name !== 'Sarah') {
        const dynamicNpc = { ...npc, x: dynamicPos.x, y: dynamicPos.y };
        drawNPC(ctx, dynamicNpc);
      } else {
        drawNPC(ctx, npc);
      }
    });

    // Draw player
    drawPlayer(ctx, gameState.playerPosition, gameState.playerGender);

  }, [gameState.gameStarted, gameState.characterSelected, gameState.currentRoom, gameState.playerPosition, gameState.playerGender, hoveredNPC, npcPositions]);

  const drawFurniture = (ctx, item) => {
    const x = item.x * TILE_SIZE;
    const y = item.y * TILE_SIZE;

    ctx.save();

    switch (item.type) {
      case 'desk':
        // Desktop
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        
        // Wood grain effect
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(x, y + 10 + i * 10);
          ctx.lineTo(x + item.width * TILE_SIZE, y + 10 + i * 10);
          ctx.stroke();
        }
        
        // Laptop
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(x + 15, y + 10, 30, 20);
        
        // Desk lamp
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(x + item.width * TILE_SIZE - 15, y + 15, 8, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'chair':
        ctx.fillStyle = item.color;
        // Seat
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        // Backrest
        ctx.fillRect(x + 5, y - 15, item.width * TILE_SIZE - 10, 18);
        break;

      case 'sofa':
        // Modern detailed sofa
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        
        // Cushion segments
        const cushionWidth = (item.width * TILE_SIZE) / 2;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + cushionWidth, y);
        ctx.lineTo(x + cushionWidth, y + item.height * TILE_SIZE);
        ctx.stroke();
        
        // Tufted buttons
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 1; j++) {
            ctx.beginPath();
            ctx.arc(x + 20 + i * 60, y + 20, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        
        // Armrests
        ctx.fillStyle = item.color;
        ctx.fillRect(x - 8, y - 5, 8, item.height * TILE_SIZE + 10);
        ctx.fillRect(x + item.width * TILE_SIZE, y - 5, 8, item.height * TILE_SIZE + 10);
        
        // Throw pillows
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(x + 10, y + 5, 18, 18);
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(x + item.width * TILE_SIZE - 28, y + 5, 18, 18);
        break;

      case 'table':
        if (item.round) {
          // Round table with detail
          ctx.fillStyle = item.color;
          ctx.beginPath();
          ctx.ellipse(
            x + (item.width * TILE_SIZE) / 2,
            y + (item.height * TILE_SIZE) / 2,
            (item.width * TILE_SIZE) / 2,
            (item.height * TILE_SIZE) / 2,
            0, 0, Math.PI * 2
          );
          ctx.fill();
          
          // Table edge highlight
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.lineWidth = 3;
          ctx.stroke();
          
          // Wood grain center
          ctx.fillStyle = 'rgba(139, 92, 112, 0.2)';
          ctx.beginPath();
          ctx.ellipse(
            x + (item.width * TILE_SIZE) / 2,
            y + (item.height * TILE_SIZE) / 2,
            (item.width * TILE_SIZE) / 3,
            (item.height * TILE_SIZE) / 3,
            0, 0, Math.PI * 2
          );
          ctx.fill();
          
          // Decorative items on table
          // Coffee cup
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(x + 20, y + 25, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#6b4423';
          ctx.beginPath();
          ctx.arc(x + 20, y + 25, 4, 0, Math.PI * 2);
          ctx.fill();
          
          // Magazine
          ctx.fillStyle = '#3b82f6';
          ctx.fillRect(x + 35, y + 30, 20, 15);
        } else {
          ctx.fillStyle = item.color;
          ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        }
        break;

      case 'reception':
        // Modern reception counter
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        
        // Counter top shine
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(x, y, item.width * TILE_SIZE, 10);
        
        // Front panel design
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 5, y + 15, item.width * TILE_SIZE - 10, item.height * TILE_SIZE - 20);
        
        // Computer monitor
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(x + 20, y + 15, 28, 22);
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(x + 22, y + 17, 24, 16);
        
        // Keyboard
        ctx.fillStyle = '#374151';
        ctx.fillRect(x + 20, y + 40, 28, 10);
        
        // Phone
        ctx.fillStyle = '#6b7280';
        ctx.fillRect(x + item.width * TILE_SIZE - 35, y + 20, 15, 20);
        
        // Decorative plant on desk
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(x + item.width * TILE_SIZE - 15, y + 25, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#92400e';
        ctx.fillRect(x + item.width * TILE_SIZE - 20, y + 30, 10, 8);
        break;

      case 'plant':
        // Pot
        ctx.fillStyle = '#92400e';
        ctx.fillRect(x, y + item.size * 20, item.size * TILE_SIZE, item.size * 20);
        // Leaves
        ctx.fillStyle = item.color;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI * 2) / 6;
          ctx.beginPath();
          ctx.ellipse(
            x + (item.size * TILE_SIZE) / 2 + Math.cos(angle) * 15,
            y + (item.size * TILE_SIZE) / 2 + Math.sin(angle) * 15,
            12, 8, angle, 0, Math.PI * 2
          );
          ctx.fill();
        }
        break;

      case 'whiteboard':
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        break;

      case 'bookshelf':
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        // Books
        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
        for (let i = 0; i < 12; i++) {
          ctx.fillStyle = colors[i % colors.length];
          ctx.fillRect(
            x + 5 + (i % 4) * 10,
            y + 10 + Math.floor(i / 4) * 30,
            8, 25
          );
        }
        break;

      case 'filing':
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        // Drawers
        for (let i = 0; i < 3; i++) {
          ctx.strokeStyle = '#0e7490';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 5, y + 5 + i * 15, item.width * TILE_SIZE - 10, 12);
        }
        break;

      case 'equipment':
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        // Lens
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(x + (item.width * TILE_SIZE) / 2, y + (item.height * TILE_SIZE) / 2, 15, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'coffee':
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        // Button
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(x + 25, y + 20, 5, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'fridge':
        ctx.fillStyle = item.color;
        ctx.fillRect(x, y, item.width * TILE_SIZE, item.height * TILE_SIZE);
        // Handle
        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(x + item.width * TILE_SIZE - 8, y + 25, 5, 15);
        break;
    }

    ctx.restore();
  };

  const drawExit = (ctx, exit) => {
    const x = exit.x * TILE_SIZE;
    const y = exit.y * TILE_SIZE;
    const width = exit.width * TILE_SIZE;
    const height = exit.height * TILE_SIZE;

    // Door/exit area
    ctx.fillStyle = exit.color || '#10b981';
    ctx.globalAlpha = 0.7;
    ctx.fillRect(x, y, width, height);
    ctx.globalAlpha = 1;

    // Border
    ctx.strokeStyle = exit.color || '#10b981';
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, width, height);

    // Label - RETRO FONT, dynamically sized
    ctx.fillStyle = '#ffffff';
    
    // Determine if door is vertical or horizontal
    const isVertical = height > width;
    
    // Use smaller font for vertical doors
    const fontSize = isVertical ? 10 : 14;
    ctx.font = `bold ${fontSize}px "Press Start 2P"`;
    ctx.textAlign = 'center';
    
    // Multi-line text for better readability
    const lines = exit.label.split(' ');
    const lineHeight = fontSize + 2;
    const startY = y + height / 2 - (lines.length - 1) * lineHeight / 2;
    
    lines.forEach((line, i) => {
      ctx.fillText(line, x + width / 2, startY + i * lineHeight);
    });
  };

  const drawNPC = (ctx, npc) => {
    const x = npc.x * TILE_SIZE;
    const y = npc.y * TILE_SIZE;
    const size = 42;

    ctx.save();

    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + size + 8, size / 2, size / 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Draw specific characters
    if (npc.name === 'Sarah') {
      // Receptionist - Modern chic with rose blazer
      // Rose/mauve blazer
      ctx.fillStyle = '#f472b6';
      ctx.fillRect(x - 14, y + 14, 28, 22);
      
      // White silk blouse underneath
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x - 11, y + 16);
      ctx.lineTo(x + 11, y + 16);
      ctx.lineTo(x + 9, y + 30);
      ctx.lineTo(x - 9, y + 30);
      ctx.closePath();
      ctx.fill();
      
      // Blazer lapels
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.moveTo(x, y + 16);
      ctx.lineTo(x - 12, y + 18);
      ctx.lineTo(x - 10, y + 26);
      ctx.lineTo(x, y + 22);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y + 16);
      ctx.lineTo(x + 12, y + 18);
      ctx.lineTo(x + 10, y + 26);
      ctx.lineTo(x, y + 22);
      ctx.closePath();
      ctx.fill();
      
      // Navy pencil skirt
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(x - 12, y + 36, 24, 12);
      
      // Delicate gold necklace
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y + 19, 7, 0.4, Math.PI - 0.4);
      ctx.stroke();
      
      // Gold pendant
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(x, y + 22, 2.5, 0, Math.PI * 2);
      ctx.fill();
      
      // Head
      ctx.fillStyle = '#fce8d0';
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fill();
      
      // Soft wavy hair - shoulder length
      ctx.fillStyle = '#8b6f47';
      ctx.beginPath();
      ctx.ellipse(x, y - 7, 14, 11, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      
      // Soft waves on sides
      ctx.beginPath();
      ctx.moveTo(x - 14, y - 5);
      ctx.quadraticCurveTo(x - 16, y + 2, x - 13, y + 10);
      ctx.quadraticCurveTo(x - 11, y + 4, x - 12, y - 2);
      ctx.closePath();
      ctx.fill();
      
      ctx.beginPath();
      ctx.moveTo(x + 14, y - 5);
      ctx.quadraticCurveTo(x + 16, y + 2, x + 13, y + 10);
      ctx.quadraticCurveTo(x + 11, y + 4, x + 12, y - 2);
      ctx.closePath();
      ctx.fill();
      
      // Soft bangs
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 7);
      ctx.quadraticCurveTo(x - 4, y - 9, x + 3, y - 6);
      ctx.quadraticCurveTo(x + 8, y - 8, x + 12, y - 7);
      ctx.lineTo(x + 12, y - 4);
      ctx.quadraticCurveTo(x, y - 6, x - 12, y - 4);
      ctx.closePath();
      ctx.fill();
      
      // Friendly eyes
      ctx.fillStyle = '#1a1410';
      ctx.beginPath();
      ctx.arc(x - 5, y + 1, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 5, y + 1, 2.5, 0, Math.PI * 2);
      ctx.fill();
      
      // Eye highlights
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 4, y, 1, 0, Math.PI * 2);
      ctx.arc(x + 6, y, 1, 0, Math.PI * 2);
      ctx.fill();
      
      // Natural smile
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y + 7, 5, 0, Math.PI);
      ctx.stroke();
      
      // Subtle blush
      ctx.fillStyle = 'rgba(244, 114, 182, 0.25)';
      ctx.beginPath();
      ctx.ellipse(x - 8, y + 4, 4, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 8, y + 4, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Small gold stud earrings
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(x - 14, y + 2, 2, 0, Math.PI * 2);
      ctx.arc(x + 14, y + 2, 2, 0, Math.PI * 2);
      ctx.fill();
      
    } else if (npc.name === 'Mike') {
      // Creative Director - Casual Friday tech CEO style
      // Dark grey chinos
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(x - 14, y + 34, 28, 14);
      
      // Heather blue button-up shirt (rolled sleeves)
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(x - 15, y + 14, 30, 22);
      
      // Shirt buttons
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(x, y + 18 + i * 6, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Rolled sleeves detail
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(x - 15, y + 14, 30, 4);
      
      // Collar
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.moveTo(x - 8, y + 14);
      ctx.lineTo(x - 12, y + 18);
      ctx.lineTo(x - 6, y + 20);
      ctx.lineTo(x, y + 16);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 14);
      ctx.lineTo(x + 12, y + 18);
      ctx.lineTo(x + 6, y + 20);
      ctx.lineTo(x, y + 16);
      ctx.closePath();
      ctx.fill();
      
      // Head
      ctx.fillStyle = '#f5d0a9';
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);

  // Handle player movement
  const handleKeyDown = (e) => {
    
    // Handle dialogue navigation with arrow keys and space
    const currentDialogue = dialogueRef.current;
    if (currentDialogue && currentDialogue.options && currentDialogue.options.length > 0) {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault();
          setSelectedDialogueOption(prev => {
            const newVal = prev > 0 ? prev - 1 : currentDialogue.options.length - 1;
            selectedOptionRef.current = newVal;
            return newVal;
          });
          return;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault();
          setSelectedDialogueOption(prev => {
            const newVal = prev < currentDialogue.options.length - 1 ? prev + 1 : 0;
            selectedOptionRef.current = newVal;
            return newVal;
          });
          return;
        case ' ':
        case 'Enter':
          e.preventDefault();
          // Execute the currently selected option using ref for reliability
          const selectedOption = currentDialogue.options[selectedOptionRef.current];
          if (selectedOption && selectedOption.action) {
            selectedOption.action();
          }
          return;
      }
      return; // Don't process movement when dialogue is open
    }
    
    if (!gameState.gameStarted || !gameState.characterSelected) return;

    const { x, y } = gameState.playerPosition;
    let newX = x;
    let newY = y;
    const speed = 0.3;

    switch (e.key) {
      case 'ArrowUp':
      case 'w':
      case 'W':
        newY = Math.max(0.5, y - speed);
        break;
      case 'ArrowDown':
      case 's':
      case 'S':
        newY = Math.min(ROOM_HEIGHT - 0.5, y + speed);
        break;
      case 'ArrowLeft':
      case 'a':
      case 'A':
        newX = Math.max(0.5, x - speed);
        break;
      case 'ArrowRight':
      case 'd':
      case 'D':
        newX = Math.min(ROOM_WIDTH - 0.5, x + speed);
        break;
      case ' ':
      case 'Enter':
        e.preventDefault();
        checkInteractions();
        return;
    }

    if (newX !== x || newY !== y) {
      playerPositionRef.current = { x: newX, y: newY };
      setGameState(prev => ({
        ...prev,
        playerPosition: { x: newX, y: newY },
        energy: Math.max(0, prev.energy - 0.3)
      }));
      
      // Check if player is near an exit
      checkExits(newX, newY);
    }
  };

  const checkExits = (x, y) => {
    const currentRoom = rooms[gameState.currentRoom];
    
    currentRoom.exits.forEach(exit => {
      // Check if player is anywhere within the exit area
      const isWithinX = x >= exit.x && x < exit.x + exit.width;
      const isWithinY = y >= exit.y && y < exit.y + exit.height;
      
      if (isWithinX && isWithinY) {
        changeRoom(exit.target);
      }
    });
  };

  const changeRoom = (targetRoom) => {
    playerPositionRef.current = { x: 8, y: 6 };
    setGameState(prev => ({
      ...prev,
      currentRoom: targetRoom,
      playerPosition: { x: 8, y: 6 } // Reset to center of new room
    }));
    showNotification(`Entered ${rooms[targetRoom].name}`);
  };

  const checkInteractions = () => {
    // Use ref for most current position (state may be stale in closure)
    const { x, y } = playerPositionRef.current;
    const currentRoom = rooms[gameState.currentRoom];
    
    currentRoom.npcs.forEach(npc => {
      const distance = Math.sqrt(Math.pow(x - npc.x, 2) + Math.pow(y - npc.y, 2));
      if (distance < 2.5) {
        talkToNPC(npc.name);
      }
    });
  };

  const handleCanvasMouseMove = (e) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const rect = canvas.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) / TILE_SIZE;
    const mouseY = (e.clientY - rect.top) / TILE_SIZE;

    const currentRoom = rooms[gameState.currentRoom];
    let foundNPC = null;

    currentRoom.npcs.forEach(npc => {
      const distance = Math.sqrt(Math.pow(mouseX - npc.x, 2) + Math.pow(mouseY - npc.y, 2));
      if (distance < 0.7) {
        foundNPC = npc.name;
      }
    });

    setHoveredNPC(foundNPC);
  };

    if (!tutorialComplete) {
      if (npcName === 'Sarah') {

          setDialogue({
            speaker: 'Sarah',
            text: `Welcome to the agency, ${playerName}! I'm Sarah, on reception. You're joining Planning as our new Junior Strategist - which means your job is to work out what we should say, and why, before anyone decides how to say it. Let me point you around.`,

              {
